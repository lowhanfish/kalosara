# Cloudra terminates public HTTPS and forwards HTTP to the private VPS address.
# Include inside http{}, replacing __PRIVATE_IP__ and __DOMAIN__.
# Never forward public traffic directly to Node or expose the uploads directory.
log_format kalosara_cloudra escape=json '{"status":$status,"seconds":$request_time,"requestId":"$upstream_http_x_request_id"}';
limit_req_zone $binary_remote_addr zone=kalosara_cloudra_auth:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=kalosara_cloudra_connections:1m;
server {
  listen __PRIVATE_IP__:80 default_server;
  server_name _;
  access_log off;
  return 444;
}
server {
  listen __PRIVATE_IP__:80;
  server_name __DOMAIN__;
  server_tokens off;
  access_log /var/log/nginx/kalosara-access.log kalosara_cloudra;
  error_log /var/log/nginx/kalosara-error.log crit;
  client_max_body_size 1m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  keepalive_timeout 15s;
  limit_conn kalosara_cloudra_connections 10;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;
  proxy_send_timeout 65s;
  proxy_set_header Host __DOMAIN__;
  proxy_set_header X-Forwarded-Proto https;
  # Do not trust arbitrary client-supplied forwarding headers.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  location /api/internal/ { return 404; }
  location = /api/v1/auth/login {
    limit_req zone=kalosara_cloudra_auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
  }
  location = /api/v1/auth/register {
    limit_req zone=kalosara_cloudra_auth burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
  }
  location = /api/v1/admin/media {
    client_max_body_size 21m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:4000;
  }
  location /api/v1/ { proxy_pass http://127.0.0.1:4000; }
  location / { proxy_pass http://127.0.0.1:3001; }
}
