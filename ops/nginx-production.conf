# Host Nginx reference. Replace __DOMAIN__; install certs first. Not Docker.
# Include in http{}; nginx -t before reload. Never expose backend/public/uploads.
log_format kalosara escape=json '{"status":$status,"seconds":$request_time,"upstreamSeconds":"$upstream_response_time","requestId":"$upstream_http_x_request_id"}';
limit_req_zone $binary_remote_addr zone=kalosara_auth:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=kalosara_connections:1m;
server {
  listen 80;
  server_name __DOMAIN__;
  location /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
  location / { return 308 https://__DOMAIN__$request_uri; }
}
server {
  listen 443 ssl;
  server_name __DOMAIN__;
  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  access_log /var/log/nginx/kalosara-access.log kalosara;
  # Default nginx error logs may contain raw IP/request paths; restrict and retain briefly.
  error_log /var/log/nginx/kalosara-error.log crit;
  client_max_body_size 1m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  keepalive_timeout 15s;
  limit_conn kalosara_connections 10;
  proxy_connect_timeout 5s;
  proxy_read_timeout 65s;
  proxy_send_timeout 65s;
  proxy_set_header Host __DOMAIN__;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  location /api/internal/ { return 404; }
  location = /api/v1/auth/login {
    limit_req zone=kalosara_auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
  }
  location = /api/v1/auth/register {
    limit_req zone=kalosara_auth burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:4000;
  }
  location = /api/v1/admin/media {
    client_max_body_size 21m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:4000;
  }
  location /api/v1/ { proxy_pass http://127.0.0.1:4000; }
  location / { proxy_pass http://127.0.0.1:3001; }
}
